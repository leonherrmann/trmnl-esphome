esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - logger.log: "Boot complete; starting render loop."
      - script.execute: manage_run_and_sleep

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  # To enable encryption, generate a key with `openssl rand -base64 32`
  # and uncomment:
  # encryption:
  #   key: "PASTE_BASE64_KEY_HERE"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

captive_portal:
