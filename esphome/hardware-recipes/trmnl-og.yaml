# ============================================================================
# TARGET DEVICE: TRMNL OG
# Name: TRMNL OG
# Resolution: 800x480
# Shape: rect
# Orientation: landscape
# Inverted: false
# Dark Mode: disabled
# Refresh Interval: 900
# ============================================================================
#
# Retail TRMNL OG sold at usetrmnl.com.
# ESP32-C3 + Waveshare 7.5" V2 B/W e-paper.
# Pin assignments mirror BOARD_TRMNL in the stock firmware
# (src/DEV_Config.h:62-70 of leonherrmann/trmnl-esphome).
#
# The display id is `epaper_display` so it matches the id that the designer's
# auto-generated `script:` block uses (`component.update: epaper_display`),
# avoiding a manual rename after every paste.
#
# This recipe is intentionally always-on (no deep_sleep). The designer adds
# its own polling-loop script to refresh the panel; deep_sleep would conflict
# with that. If you want battery-grade sleep behavior, drop the script and
# add a deep_sleep block manually after pasting.

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

spi:
  id: epaper_spi
  clk_pin: GPIO7      # EPD SCK
  mosi_pin: GPIO8     # EPD MOSI

display:
  - platform: waveshare_epaper
    id: epaper_display
    spi_id: epaper_spi
    model: 7.50inv2     # 7.50inv2p tested but the TRMNL OG ships an older panel
    cs_pin: GPIO6     # EPD CS
    dc_pin: GPIO5     # EPD DC
    busy_pin: GPIO4   # EPD BUSY
    reset_pin: GPIO10 # EPD RST
    rotation: 0
    update_interval: never
    lambda: |-
      # __LAMBDA_PLACEHOLDER__

binary_sensor:
  - platform: gpio
    id: trmnl_button
    name: "TRMNL Button"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - component.update: epaper_display

i2c:
  id: sensor_bus
  sda: GPIO21
  scl: GPIO20
  scan: true
  frequency: 100kHz

sensor:
  - platform: sht4x
    i2c_id: sensor_bus
    address: 0x44
    update_interval: 60s
    temperature:
      name: "TRMNL Temperature"
    humidity:
      name: "TRMNL Humidity"
